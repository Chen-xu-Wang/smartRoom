# ============================================================
# 价格与排放因子（示例值，可配置）
# ------------------------------------------------------------
# 与契约样例 price_note 一致。所有数值均为示例，不代表任何特定城市的现行价格。
# 更换地区时只改本文件；契约③ 的 price_note 由生成脚本根据本文件自动写出。
# ============================================================

meta:
  version: "1.0"
  source: EXAMPLE

electricity:
  scheme: TIME_OF_USE
  periods:
    - {name: PEAK, start: "08:00", end: "22:00", price_yuan_per_kwh: 0.62}
    - {name: VALLEY, start: "22:00", end: "08:00", price_yuan_per_kwh: 0.32}

water:
  scheme: FLAT
  price_yuan_per_m3: 3.5
  note: "示例采用单一水价；如需阶梯水价，改为 TIERED 并填写 tiers"

carbon:
  grid_emission_factor_kg_per_kwh: 0.5703
  source: MEE_EF
  note: "2022 年度全国电网平均排放因子，以生态环境部公布原文为准"

price_note_template: "示例价格：峰时电价{peak}元/kWh({peak_start}-{peak_end})，谷时电价{valley}元/kWh；水价{water}元/m³；电网排放因子{ef}kg/kWh。均为可配置示例值，不代表特定城市现行价格。"
